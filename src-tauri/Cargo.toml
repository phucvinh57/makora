[package]
name = "makora"
version = "0.1.0"
edition = "2021"

[lib]
name = "makora_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "makora"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
anyhow = "1.0.103"
chrono = "0.4.45"
tiny_http = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.6.0"
url = "2.5.7"
tauri-plugin-opener = "2.6.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
sha2 = "0.11.0"
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common"] }

[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common", "vulkan"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common", "metal"] }
objc2 = "0.6"
block2 = "0.6"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common", "vulkan"] }
zbus = "5"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
