[package]
name = "makora-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "makora_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "makora-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
anyhow = "1.0.103"
chrono = "0.4.45"
tiny_http = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
rusqlite_migration = "2.6.0"
regex = "1.11.3"
url = "2.5.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
core-foundation-sys = "0.8"

# The GNOME provider talks to the shell extension over the session bus, and
# the wlroots provider speaks Wayland directly. `zbus`'s blocking API is used
# deliberately: the focus watcher owns a plain thread on every platform, and
# nothing else in this crate needs an async runtime.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
