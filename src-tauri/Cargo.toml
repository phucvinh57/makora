[package]
name = "makora"
version = "0.1.0"
edition = "2021"
default-run = "makora"

[lib]
name = "makora_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "makora"
path = "src/main.rs"

[[bin]]
name = "makora-bridge"
path = "src/bin/makora_bridge.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-single-instance = "2.5.1"
anyhow = "1.0.104"
thiserror = "2"
chrono = "0.4.45"
interprocess = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
url = "2.5.8"
tauri-plugin-opener = "2.7.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
sha2 = "0.11.0"
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common"] }
llama-cpp-sys-2 = "0.1.157"
notify-rust = "4.18.1"
keyring = "4.2.0"
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common", "vulkan"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
widestring = "1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common", "metal"] }
objc2 = "0.6"
block2 = "0.6"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["common", "vulkan"] }
zbus = "5"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
