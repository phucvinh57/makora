[workspace]
resolver = "2"
members = ["crates/makora-core", "crates/makora"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
makora-core = { path = "crates/makora-core" }
anyhow = "1.0.104"
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
