name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-26.04
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend as Tauri does
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  bundle:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x64
            target: ""
          - platform: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          - platform: ubuntu-26.04
            arch: x64
            target: ""

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            build-essential

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-cargo-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundle
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            bun tauri build --target "${{ matrix.target }}"
          else
            bun tauri build
          fi

      - name: Verify macOS app icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Makora.app/Contents/Resources" \
            -type f -name '*.icns' -print -quit | grep -q .

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: makora-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: makora-macos-${{ github.sha }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: makora-linux-${{ github.sha }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/deb/*.deb
