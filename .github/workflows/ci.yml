name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      extension: ${{ steps.filter.outputs.extension }}
      demo: ${{ steps.filter.outputs.demo }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            js:
              - *ci
              - 'scripts/**'
              - 'extensions/**'
              - 'demo/**'
              - package.json
              - bun.lock
              - biome.json
            extension:
              - *ci
              - 'extensions/browser/**'
              - package.json
              - bun.lock
            demo:
              - *ci
              - 'demo/**'
              - package.json
            rust:
              - *ci
              - 'crates/**'
              - Cargo.toml
              - Cargo.lock
              - '.cargo/**'
              - .github/cargo-ci.toml

  js:
    name: JS (extension, demo)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ needs.changes.outputs.demo == 'true' && hashFiles('demo/bun.lock') || 'no-demo' }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install demo dependencies
        if: needs.changes.outputs.demo == 'true'
        run: bun install --cwd demo --frozen-lockfile

      - name: Biome
        run: bunx biome ci extensions scripts demo

      - name: Browser extension typecheck
        if: needs.changes.outputs.extension == 'true'
        run: bun run ext:check

      - name: Demo typecheck
        if: needs.changes.outputs.demo == 'true'
        run: bun run demo:check

  rust:
    name: Rust (${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Fetch app icons from LFS
        run: git lfs pull --include="crates/makora/icons/*"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libvulkan-dev \
            glslc \
            spirv-headers \
            build-essential

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Use the CI Cargo profile
        run: install -D .github/cargo-ci.toml ~/.cargo/config.toml

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.check }}-${{ hashFiles('Cargo.toml', '.cargo/config.toml', '.github/cargo-ci.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: matrix.check == 'test'
        run: cargo test --workspace
