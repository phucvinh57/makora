name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release version to build (for example, v1.2.3)"
        required: true
        type: string
      build_linux:
        description: Build Linux installers
        required: false
        default: true
        type: boolean
      build_macos:
        description: Build the macOS installer for Apple silicon
        required: false
        default: false
        type: boolean
      build_windows:
        description: Build Windows installers
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_name:
        description: "Release version to build (for example, v1.2.3)"
        required: true
        type: string
      build_linux:
        description: Build Linux installers
        required: false
        default: true
        type: boolean
      build_macos:
        description: Build the macOS installer for Apple silicon
        required: false
        default: false
        type: boolean
      build_windows:
        description: Build Windows installers
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}

    steps:
      - name: Generate platform matrix
        id: generate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const enabled = process.env.EVENT_NAME === "push"
            ? { linux: true, macos: false, windows: false }
            : {
                linux: process.env.BUILD_LINUX === "true",
                macos: process.env.BUILD_MACOS === "true",
                windows: process.env.BUILD_WINDOWS === "true",
              };
          const matrix = [];

          if (enabled.linux) {
            matrix.push({
              platform: "ubuntu-26.04",
              arch: "x64",
              target: "",
              artifact_name: "makora-linux",
              files: "src-tauri/target/release/bundle/deb/*.deb\nsrc-tauri/target/release/bundle/rpm/*.rpm",
            });
          }

          if (enabled.macos) {
            matrix.push({
              platform: "macos-15",
              arch: "aarch64",
              target: "aarch64-apple-darwin",
              artifact_name: "makora-macos-arm64",
              files: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg",
            });
          }

          if (enabled.windows) {
            matrix.push({
              platform: "windows-2025",
              arch: "x64",
              target: "",
              artifact_name: "makora-windows",
              files: "src-tauri/target/release/bundle/msi/*.msi\nsrc-tauri/target/release/bundle/nsis/*.exe",
            });
          }

          if (matrix.length === 0) {
            throw new Error("Select at least one platform to build.");
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  build:
    needs: select-platforms
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libvulkan-dev \
            glslc \
            spirv-headers \
            patchelf \
            build-essential

      - name: Extract release version
        id: get_version
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          release_name="${RELEASE_NAME:-$GITHUB_REF_NAME}"
          version="${release_name#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be a semantic version such as v1.2.3." >&2
            exit 1
          fi
          echo "tag=$release_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update app version
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          const updatedCargo = cargo.replace(
            /^version = ".*"$/m,
            'version = "' + version + '"',
          );
          if (updatedCargo === cargo) {
            throw new Error("package version was not found in Cargo.toml");
          }
          fs.writeFileSync(cargoPath, updatedCargo);

          const configPath = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          config.version = version;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-cargo-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.target, 'aarch64-apple-darwin') && '10.15' || '' }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            bun tauri build --target "${{ matrix.target }}"
          else
            bun tauri build
          fi

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.files }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Extract release version
        id: get_version
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          release_name="${RELEASE_NAME:-$GITHUB_REF_NAME}"
          version="${release_name#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be a semantic version such as v1.2.3." >&2
            exit 1
          fi
          echo "tag=$release_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download desktop installers
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload installers to the latest release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release view --json tagName --jq .tagName)"
          if [[ "$RELEASE_TAG" != "$latest_tag" ]]; then
            echo "Manual installer uploads must target the latest release ($latest_tag), not $RELEASE_TAG." >&2
            exit 1
          fi

          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No installer artifacts were downloaded." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Create draft GitHub release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          body: |
            ## macOS installation

            The macOS build is ad hoc signed and is not notarized by Apple. After moving Makora to Applications, try opening it once. If macOS blocks it, open **System Settings → Privacy & Security**, scroll to Security, and choose **Open Anyway** for Makora.

            If macOS still says Makora is damaged, and you downloaded it from this release, run this in Terminal:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Makora.app
            ```
          draft: true
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/**/*

  publish-chrome:
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check and build browser extension
        run: |
          bun run ext:check
          bun run ext:build --store

      - name: Set extension version and create package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Chrome Web Store publishing requires a stable vX.Y.Z tag." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}" node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;
          const manifestPath = "extensions/browser/dist/manifest.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          manifest.version = version;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          NODE
          mkdir -p "$RUNNER_TEMP/chrome-extension"
          cd extensions/browser/dist
          zip -r "$RUNNER_TEMP/chrome-extension/makora-chrome-extension.zip" .

      - name: Validate Chrome Web Store configuration
        shell: bash
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$CWS_PUBLISHER_ID" || -z "$CWS_EXTENSION_ID" || -z "$CWS_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Set CWS_PUBLISHER_ID and CWS_EXTENSION_ID repository variables and CWS_SERVICE_ACCOUNT_JSON repository secret." >&2
            exit 1
          fi

      - name: Authenticate to Google
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit extension
        shell: bash
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          item_path="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          upload_url="https://chromewebstore.googleapis.com/upload/v2/$item_path:upload"
          status_url="https://chromewebstore.googleapis.com/v2/$item_path:fetchStatus"
          publish_url="https://chromewebstore.googleapis.com/v2/$item_path:publish"
          package="$RUNNER_TEMP/chrome-extension/makora-chrome-extension.zip"

          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$package" \
            "$upload_url")"
          upload_state="$(jq -r '.uploadState // empty' <<< "$response")"

          if [[ "$upload_state" == "IN_PROGRESS" ]]; then
            for attempt in $(seq 1 40); do
              sleep 15
              response="$(curl -fsS \
                -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
                "$status_url")"
              upload_state="$(jq -r '.lastAsyncUploadState // empty' <<< "$response")"
              if [[ "$upload_state" == "SUCCEEDED" ]]; then
                break
              fi
              if [[ "$upload_state" == "FAILED" ]]; then
                echo "Chrome Web Store reported that the extension upload failed." >&2
                exit 1
              fi
            done
          fi

          if [[ "$upload_state" != "SUCCEEDED" ]]; then
            echo "Chrome Web Store upload did not complete successfully (state: ${upload_state:-unknown})." >&2
            exit 1
          fi

          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$publish_url")"
          echo "Chrome Web Store submission state: $(jq -r '.state // "unknown"' <<< "$response")"
