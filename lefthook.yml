pre-commit:
  parallel: true
  jobs:
    - name: check TypeScript
      glob: "*.{ts,tsx}"
      run: bun run check -- {staged_files}
      stage_fixed: true

    - name: check Rust
      glob: "*.{rs,toml}"
      run: cargo check --workspace

pre-push:
  jobs:
    - name: checks
      run: scripts/check.sh
