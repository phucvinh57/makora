pre-commit:
  parallel: true
  jobs:
    - name: check TypeScript
      glob: "*.{ts,tsx}"
      exclude:
        - "src/bindings/**"
      run: bun run check -- {staged_files}
      stage_fixed: true

    - name: check Rust
      root: "src-tauri/"
      glob: "*.{rs,toml}"
      run: CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/target}" cargo check

pre-push:
  jobs:
    - name: checks
      run: scripts/check.sh
