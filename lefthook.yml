pre-commit:
  parallel: true
  jobs:
    - name: check TypeScript
      glob: "*.{ts,tsx}"
      run: bun run check -- {staged_files}
      stage_fixed: true

    - name: check Rust
      root: "src-tauri/"
      glob: "*.{rs,toml}"
      run: CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$(git rev-parse --show-toplevel)/target}" cargo check
