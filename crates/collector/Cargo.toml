[package]
name = "makora-collector"
version.workspace = true
edition.workspace = true

[[bin]]
name = "makora-collector"
path = "src/main.rs"

[dependencies]
makora-core = { path = "../core" }
anyhow = "1.0.103"
chrono = "0.4.45"
ctrlc = "3.5.2"
directories = "6.0.0"
tiny_http = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
