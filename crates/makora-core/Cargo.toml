[package]
name = "makora-core"
version.workspace = true
edition.workspace = true

[lib]
name = "makora_lib"

[[bin]]
name = "makora-bridge"
path = "src/bin/makora_bridge.rs"

[dependencies]
anyhow.workspace = true
dirs = "7"
thiserror = "2"
chrono.workspace = true
interprocess = "2.4"
serde.workspace = true
serde_json.workspace = true
toml = "1"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
url = "2.5.8"
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.5"
sha2 = "0.11.1"
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common"] }
llama-cpp-sys-2 = "0.1.160"
notify-rust = "4.18.2"
keyring = "4.2.0"
ts-rs.workspace = true

[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "vulkan"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
widestring = "1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "metal"] }
objc2 = "0.6"
block2 = "0.6"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "vulkan"] }
zbus = "5"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
log = "0.4"
